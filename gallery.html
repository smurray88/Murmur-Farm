<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · Murmur Farm</title>
  <meta name="description" content="Photos of the horses, pastures and foals at Murmur Farm in Darlington, Maryland.">
  <meta name="theme-color" content="#1d3b25">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Gallery</span>
      <h1>Life on the farm</h1>
      <p>Mares, foals, stallions and 131 acres of Harford County pasture.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="gallery" id="gallery"></div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button type="button" aria-label="Close">×</button>
  <img alt="">
</div>

<footer id="site-footer"></footer>
<script>
  // To add a photo: put the file in the photos/ folder and add a line below.
  var PHOTOS = [
    { src: "https://murmurfarm.com/Sign.jpg", caption: "The farm entrance on Stafford Road" },
    { src: "https://murmurfarm.com/banner1.jpg", caption: "Murmur Farm" },
    { src: "https://murmurfarm.com/Blofeld.jpg", caption: "Blofeld" },
    { src: "https://murmurfarm.com/Warrant.jpg", caption: "Warrant" }
    // { src: "photos/foals-spring-2026.jpg", caption: "Spring foals, 2026" },
  ];
  var EMPTY_SLOTS = ["Spring foals", "Mares at pasture", "The stallion barn", "Yearlings"];

  var g = document.getElementById("gallery");
  PHOTOS.forEach(function (p) {
    var f = document.createElement("figure");
    var img = document.createElement("img");
    img.src = p.src; img.alt = p.caption; img.loading = "lazy";
    img.onerror = function () { f.remove(); };
    var c = document.createElement("figcaption"); c.textContent = p.caption;
    f.appendChild(img); f.appendChild(c);
    f.addEventListener("click", function () { open(p.src, p.caption); });
    g.appendChild(f);
  });
  EMPTY_SLOTS.forEach(function (t) {
    var f = document.createElement("figure");
    f.className = "placeholder";
    f.textContent = t + " · photo coming soon";
    g.appendChild(f);
  });

  var lb = document.getElementById("lightbox"), lbImg = lb.querySelector("img");
  function open(src, alt) { lbImg.src = src; lbImg.alt = alt; lb.classList.add("open"); }
  function close() { lb.classList.remove("open"); }
  lb.addEventListener("click", function (e) { if (e.target !== lbImg) close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
</script>
<script src="assets/site.js"></script>
</body>
</html>
