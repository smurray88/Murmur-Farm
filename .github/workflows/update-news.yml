name: Update news & results

on:
  schedule:
    - cron: "17 11 * * *"   # every day, about 7am Eastern
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    paths:
      - scripts/update_news.py
      - .github/workflows/update-news.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest news
        run: python3 scripts/update_news.py
      - name: Save if anything changed
        run: |
          if git diff --quiet data/news.json; then
            echo "No new stories."
          else
            git config user.name "murmur-farm-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "Update news & results"
            git pull --rebase origin main
            git push
          fi
